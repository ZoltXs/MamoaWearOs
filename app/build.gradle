plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mamoa.notifier'
    compileSdk 34

    defaultConfig {
        applicationId "com.mamoa.notifier"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Room schema export
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    
    // Wear OS
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
    
    // Bluetooth
    implementation 'androidx.bluetooth:bluetooth:1.0.0-alpha02'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    
    // WorkManager para watchdog y sync periodica
    implementation 'androidx.work:work-runtime:2.9.0'
    
    // Room para persistencia de datos de salud
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    
    // OkHttp para sync con servidor
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // Gson para serializar JSON
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Samsung Health SDK (opcional, para datos de salud directos)
    // implementation 'com.samsung.android:sdk-healthdata:1.5.0'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
