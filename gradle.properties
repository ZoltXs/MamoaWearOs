# Configuracion JVM para Gradle: mas memoria evita cuelgues en la sincronizacion
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Builds en paralelo y cache para acelerar la importacion
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# R class no transitiva (mejora tiempos de compilacion)
android.nonTransitiveRClass=true
